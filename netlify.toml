[build]
  command = "npm run build"
  publish = "build/"
  functions = "netlify/functions"
  [build.processing]
    skip_processing = true

# The plugin calls its translation provider through /api/cors-proxy so the
# request stays on the origin the plugin is served from. See the function for
# why DatoCMS's own proxy cannot be used by a self-hosted build.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# DatoCMS renders one iframe per field the plugin is attached to, and a record
# with many such fields loads this bundle once per iframe. Netlify's default of
# max-age=0, must-revalidate makes every one of those a conditional request, and
# over HTTP/1.1 the browser only opens six connections per origin. On a busy
# record that queue can outlast the 20 second handshake DatoCMS allows, which
# surfaces as an intermittent "Failed to load plugin".
#
# Everything under /static is content-hashed by the build, so a changed file is
# a changed filename and can be cached indefinitely. index.html deliberately
# keeps Netlify's default so a new deploy is picked up immediately.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
