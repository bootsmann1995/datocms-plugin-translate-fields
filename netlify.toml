[build]
  command = "npm run build"
  publish = "build/"
  functions = "netlify/functions"
  [build.processing]
    skip_processing = true

# The plugin calls its translation provider through /api/cors-proxy so the
# request stays on the origin the plugin is served from. See the function for
# why DatoCMS's own proxy cannot be used by a self-hosted build.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
